[project]
name = "everything-llms"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "numpy",
    "pandas",
    "transformers",
    "datasets",
    "tokenizers",
    "safetensors",
    "accelerate",
    "sentencepiece",
    "matplotlib",
    "jupyter",
    "ipykernel",
    "tqdm",
    "einops",
    "wandb",
    "scikit-learn",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
